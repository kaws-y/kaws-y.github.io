<div class="kg-search" data-kg-search hidden>
    <div class="kg-search__scrim" data-kg-search-close></div>
    <div class="kg-search__panel kg-glass kg-glass--strong" role="dialog" aria-modal="true" aria-label="全站搜索">
        <div class="kg-search__field">
            {% include kg/icon.html name="search" %}
            <input type="search" data-kg-search-input placeholder="搜索标题、标签或正文…" autocomplete="off" spellcheck="false" aria-label="搜索关键词" aria-controls="kg-search-results">
            <button class="kg-kbd-btn" type="button" data-kg-search-close aria-label="关闭搜索">Esc</button>
        </div>
        <div class="kg-search__filters" role="group" aria-label="按模块筛选">
            <button class="kg-chip" type="button" data-kg-search-module="" aria-pressed="true">全部</button>
            {%- for m in site.data.kg.modules %}{% if m.tracks.size > 0 %}
            <button class="kg-chip" type="button" data-kg-search-module="{{ m.id }}" aria-pressed="false" style="--hue:{{ m.hue }}">{{ m.title }}</button>
            {%- endif %}{% endfor %}
        </div>
        <div class="kg-search__status" data-kg-search-status aria-live="polite"></div>
        <ul class="kg-search__results" id="kg-search-results" data-kg-search-results role="listbox" aria-label="搜索结果"></ul>
        <div class="kg-search__foot">
            <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span><span><kbd>Esc</kbd> 关闭</span>
            <a href="{{ '/library/' | relative_url }}">在文库中筛选 →</a>
        </div>
    </div>
</div>
