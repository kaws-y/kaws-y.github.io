{%- include kg/resolve.html doc=page -%}
{%- assign kg_active = kg_mod.id | default: page.nav -%}
<header class="kg-nav" data-kg-nav>
    <div class="kg-nav__bar kg-glass">
        <a class="kg-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} 首页">
            <span class="kg-brand__mark" aria-hidden="true"><img class="kg-brand__logo" src="{{ '/img/logo-mark.png' | relative_url }}" alt="" width="186" height="96" decoding="async"></span>
            <span class="kg-brand__text">{{ site.data.kg.brand.name }}<small>{{ site.data.kg.brand.tagline }}</small></span>
        </a>

        <nav class="kg-nav__links" aria-label="主导航" data-kg-menu>
            {%- for m in site.data.kg.modules %}
            <a href="{{ m.url | relative_url }}"{% if kg_active == m.id %} aria-current="page"{% endif %}>{{ m.title }}</a>
            {%- endfor %}
            <span class="kg-nav__sep" aria-hidden="true"></span>
            <a href="{{ '/library/' | relative_url }}"{% if kg_active == 'library' %} aria-current="page"{% endif %}>文库</a>
            <a href="{{ '/map/' | relative_url }}"{% if kg_active == 'map' %} aria-current="page"{% endif %}>知识地图</a>
            <a class="kg-nav__more" href="{{ '/1-resources/' | relative_url }}">资料索引</a>
            <a class="kg-nav__more" href="{{ '/2-tags/' | relative_url }}">标签</a>
            <a class="kg-nav__more" href="{{ '/3-about/' | relative_url }}">关于</a>
        </nav>

        <div class="kg-nav__tools">
            <button class="kg-search-trigger" type="button" data-kg-search-open aria-label="搜索（快捷键 Ctrl K 或 /）">
                {% include kg/icon.html name="search" %}<span>搜索</span><kbd>Ctrl K</kbd>
            </button>
            <a class="kg-iconbtn" href="{{ '/shelf/' | relative_url }}" aria-label="我的空间：收藏与最近阅读"{% if kg_active == 'shelf' %} aria-current="page"{% endif %}>{% include kg/icon.html name="bookmark" %}<span class="kg-badge" data-kg-fav-count hidden></span></a>
            <button class="kg-iconbtn kg-nav__toggle" type="button" data-kg-menu-toggle aria-label="展开导航" aria-expanded="false">
                {% include kg/icon.html name="menu" %}
            </button>
        </div>
    </div>
</header>
