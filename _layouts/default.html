<!DOCTYPE html>
<html lang="zh-CN">

{% include head.html %}

<body class="kg-body{% if page.layout %} kg-layout-{{ page.layout }}{% endif %}{% if page.body_class %} {{ page.body_class }}{% endif %}">
    <a class="kg-skip" href="#kg-main">跳到正文</a>
    <div class="kg-ambient" aria-hidden="true"><i></i><i></i><i></i></div>

    {% include nav.html %}

    <main id="kg-main" class="kg-main">
        {{ content }}
    </main>

    {% include footer.html %}
    {% include kg/search.html %}

    <button class="kg-totop kg-glass" type="button" data-kg-totop aria-label="回到顶部" hidden>{% include kg/icon.html name="top" %}</button>

    <script>
    window.KG = {
        base: {{ site.baseurl | jsonify }},
        index: "{{ '/search.json' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}",
        modules: [{% for m in site.data.kg.modules %}{"id":{{ m.id | jsonify }},"title":{{ m.title | jsonify }},"hue":{{ m.hue }},"url":"{{ m.url | relative_url }}"}{% unless forloop.last %},{% endunless %}{% endfor %}]
    };
    </script>
    <script defer src="{{ '/assets/kg/js/kg.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}"></script>

    {% if site.service-worker %}
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}').catch(function () {});
        });
    }
    </script>
    {% endif %}

    {% if site.ga_track_id %}
    <script>
    (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
    (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
    m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
    })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
    ga('create', '{{ site.ga_track_id }}', '{{ site.ga_domain }}');
    ga('send', 'pageview');
    </script>
    {% endif %}
    {% if site.ba_track_id %}
    <script>
    var _hmt = _hmt || [];
    (function() {
      var hm = document.createElement("script");
      hm.src = "//hm.baidu.com/hm.js?{{ site.ba_track_id }}";
      var s = document.getElementsByTagName("script")[0];
      s.parentNode.insertBefore(hm, s);
    })();
    </script>
    {% endif %}
</body>

</html>
