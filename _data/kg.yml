# Knowledge Garden 信息架构（唯一数据源）
# - 文章归属：把文章 slug（文件名去掉日期与扩展名）写进对应 track 的 posts 列表；
#   或者直接在文章 front matter 里写 `module: <id>` + `track: <id>`，无需改这里。
# - docs/ 下的知识库页面通过 front matter 的 module / track / order 归属。

brand:
  name: Wonderland
  tagline: Knowledge Garden
  intro: 一座持续生长的个人数字知识空间——把学过的东西，整理成可以再次走进去的地方。

modules:
  - id: handbook
    title: 技术手册
    en: Handbook
    url: /handbook/
    hue: 218
    glyph: layers
    desc: 前端、后端与区块链三条技术主线，从指引篇出发逐层深入。
    tracks:
      - id: frontend
        title: 前端技术手册
        en: Frontend
        desc: 从通用能力到 Node.js 运行时：文件系统、域名解析与网络服务。
        posts: [回溯前端之路, Node学习, node文件系统操作, 域名解析, 网络服务]
      - id: backend
        title: 后端技术手册
        en: Backend
        desc: Java 基础与虚拟机、微服务、Go 与大数据生态。
        posts: [Java重生, Java基础, Java虚拟机, 微服务, Go语言笔记, BigData大跃进]
      - id: blockchain
        title: 区块链技术手册
        en: Blockchain
        desc: 从概念、共识到技术栈的区块链入门路径。
        posts: [区块链概述, 区块链]

  - id: ruankao
    title: 软考架构
    en: System Architect
    url: /ruankao/
    hue: 252
    glyph: compass
    desc: 软考高级「系统架构设计师」备考体系：14 章知识库与 7 个案例专题。
    tracks:
      - id: chapters
        title: 14 章知识库
        en: Knowledge Base
        view: tiles
        desc: 按统一结构整理的分章知识库：知识地图、核心知识、易错点与真题方向。
      - id: cases
        title: 7 个案例专题
        en: Case Studies
        view: tiles
        desc: 案例分析高频技术栈：云原生、微服务、大数据、DDD、缓存、大模型与消息队列。
      - id: notes
        title: 精讲笔记
        en: Notes
        desc: 与知识库同步的博客精讲版，按建议的备考顺序排列。
        posts: [系统架构设计, 软件工程, 需求工程, 系统分析与设计, 数据库设计, 软件可靠性, 软件测试, 项目管理, 计算机系统, 操作系统, 计算机网络, 信息安全技术, 法律法规, 系统运行与维护]

  - id: agi
    title: AGI
    en: Intelligence
    url: /agi/
    hue: 190
    glyph: spark
    desc: 人工智能与大模型：从联邦学习到 RAG、Agent 的工程化落地。
    tracks:
      - id: foundations
        title: 智能基础
        en: Foundations
        desc: 机器学习与隐私计算的基础概念。
        posts: [联邦学习]
    related:
      - title: 大模型应用（RAG / MCP / Agent / ReAct）
        note: 软考案例专题 06
        path: docs/架构师知识库/案例专题/06-大模型应用.md

  - id: life
    title: 代码人生
    en: Code & Life
    url: /life/
    hue: 28
    glyph: feather
    desc: 调研、随笔与工程之外的记录。
    tracks:
      - id: journal
        title: 随笔与调研
        en: Journal
        desc: 站点故事与零散的调研梳理。
        posts: [renamed, 地址标准化]

  - id: reading
    title: 精品阅读
    en: Reading Room
    url: /reading/
    hue: 152
    glyph: book
    desc: 值得反复翻阅的书籍、报告与站点。
    tracks: []

# 首页精选：size 取 lg / md / sm；post 为文章 slug，path 为 docs 页面源路径
featured:
  - size: lg
    path: docs/架构师知识库/04-系统架构设计.md
    blurb: 架构风格、质量属性与 ATAM 评估、ABSD 与 DSSA——案例与论文的共同主线，也是整个备考体系的地基。
  - size: md
    post: Java虚拟机
    blurb: 运行时数据区、垃圾收集与类加载机制的完整梳理。
  - size: md
    post: 区块链概述
    blurb: 从账本、共识到智能合约，建立对区块链的整体认知。
  - size: sm
    post: 回溯前端之路
  - size: sm
    post: 微服务
  - size: sm
    path: docs/架构师知识库/案例专题/06-大模型应用.md
  - size: sm
    post: 网络服务

